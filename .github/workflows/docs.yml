name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'website/**'
      - 'scripts/docs/**'
      - 'dotm/customUI/customUI14.xml'
      - 'modules/UI_MacroRegistry.bas'
      - 'userforms/frmQuickToolbar.frm'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'website/**'
      - 'scripts/docs/**'
      - 'dotm/customUI/customUI14.xml'
      - 'modules/UI_MacroRegistry.bas'
      - 'userforms/frmQuickToolbar.frm'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Install site dependencies
        working-directory: website
        run: npm ci
      - name: Sync canonical manual into the site
        run: python scripts/docs/sync_starlight.py
      - name: Check source coverage and Markdown links
        run: python scripts/docs/check_docs.py
      - name: Build site
        working-directory: website
        run: npm run build
      - name: Check rendered links, assets and search index
        run: python scripts/docs/check_docs.py --site-dir website/dist --base-path /RATools-for-Word
      - name: Upload site for review
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: website/dist
      - name: Prepare Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
