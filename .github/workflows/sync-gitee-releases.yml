name: Sync Releases to Gitee

on:
  workflow_run:
    workflows: ["Release DOTM"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag name to sync (leave empty to sync all missing releases/assets)"
        required: false
        type: string

concurrency:
  group: sync-gitee-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-releases:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER || github.repository_owner }}
      GITEE_REPO: ${{ vars.GITEE_REPO || github.event.repository.name }}

    steps:
      - name: Check Gitee token
        id: check
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::notice::GITEE_TOKEN secret is not configured; skipping Gitee release sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Resolve Gitee authenticated user
        if: steps.check.outputs.enabled == 'true'
        id: gitee_user
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          RESP=""
          for attempt in 1 2 3 4 5; do
            EXTRA_FLAGS="--http1.1"
            if [ "$attempt" -ge 3 ]; then
              EXTRA_FLAGS="--http1.1 --tlsv1.2"
            fi
            if RESP=$(curl -fsSL $EXTRA_FLAGS --connect-timeout 15 --max-time 45 -A "$UA" -H "Authorization: Bearer ${GITEE_TOKEN}" "https://gitee.com/api/v5/user"); then
              break
            fi
            echo "Attempt $attempt to query Gitee /api/v5/user failed; retrying in $((attempt * 2))s..." >&2
            sleep $((attempt * 2))
          done

          if [ -z "$RESP" ]; then
            echo "::error::Failed to reach Gitee API after 5 attempts. Running TLS diagnostic (no token):"
            curl -vI --http1.1 --tlsv1.2 --connect-timeout 15 --max-time 20 -A "$UA" "https://gitee.com/api/v5/user" || true
            exit 1
          fi

          LOGIN=$(printf '%s' "$RESP" | python3 -c "import sys, json; print(json.load(sys.stdin)['login'])")
          if [ -z "$LOGIN" ]; then
            echo "::error::Failed to resolve Gitee login from GITEE_TOKEN."
            exit 1
          fi
          echo "login=${LOGIN}" >> "$GITHUB_OUTPUT"

      - name: Ensure branches and tags are synced to Gitee
        if: steps.check.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_AUTH_USER: ${{ steps.gitee_user.outputs.login }}
        run: |
          set -euo pipefail

          git clone --bare "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${RUNNER_TEMP}/mirror-release.git"
          cd "${RUNNER_TEMP}/mirror-release.git"

          ASKPASS_SCRIPT="${RUNNER_TEMP}/gitee-askpass.sh"
          printf '#!/usr/bin/env bash\nprintf "%%s\\n" "$GITEE_TOKEN"\n' > "$ASKPASS_SCRIPT"
          chmod +x "$ASKPASS_SCRIPT"

          git config http.version HTTP/1.1
          git config http.postBuffer 524288000

          for attempt in 1 2 3; do
            if GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$ASKPASS_SCRIPT" \
              git push --prune "https://${GITEE_AUTH_USER}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" \
              "+refs/heads/*:refs/heads/*" \
              "+refs/tags/*:refs/tags/*"; then
              exit 0
            fi
            echo "git push attempt $attempt failed; retrying in $((attempt * 3))s..." >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Install Python dependencies
        if: steps.check.outputs.enabled == 'true'
        run: python3 -m pip install --quiet requests

      - name: Sync GitHub Releases and assets to Gitee
        if: steps.check.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ github.event.inputs.tag_name || github.event.release.tag_name || '' }}
        run: python3 .github/scripts/sync_gitee_releases.py
